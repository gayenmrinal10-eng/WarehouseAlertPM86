<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Warehouse Connect</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; padding: 16px; background: #f4f6f8; color: #111; }
    .card { max-width: 500px; margin: 0 auto; background: #fff; padding: 18px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    h2 { margin: 0 0 8px; font-size: 20px; }
    p.sub { margin: 0 0 16px; color: #555; font-size: 14px; }
    input[type="text"], select { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; background: #fff; }
    button { width: 100%; padding: 12px; margin-bottom: 8px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
    .btn-primary { background: #1976d2; color: #fff; }
    .btn-green { background: #2e7d32; color: #fff; }
    .btn-red { background: #d32f2f; color: #fff; }
    .btn-gray { background: #e0e0e0; color: #111; }
    .row { display: flex; gap: 8px; margin-bottom: 10px; }
    .row button { margin-bottom: 0; flex: 1; padding: 10px 6px; font-size: 13px; }
    #status { font-size: 14px; font-weight: 600; color: #1b5e20; margin-bottom: 4px; }
    #deviceCount { font-size: 13px; color: #1976d2; font-weight: 600; margin-bottom: 8px; }
    #targetBox { margin-bottom: 10px; }
    #targetBox label { display: block; font-size: 12px; font-weight: 600; color: #555; margin-bottom: 4px; }
    #incomingCallBox { background: #fff3e0; border: 2px solid #ef6c00; border-radius: 10px; padding: 12px; margin-bottom: 12px; text-align: center; }
    #incomingCallText { font-weight: 700; color: #e65100; margin-bottom: 10px; font-size: 15px; }
    #chatBox { height: 260px; overflow-y: auto; background: #f8f9fa; border: 1px solid #ddd; border-radius: 8px; padding: 10px; margin-bottom: 10px; font-size: 14px; white-space: pre-wrap; }
    #qrContainer { text-align: center; margin: 12px 0; display: none; }
    #qrcode { display: inline-block; padding: 10px; background: #fff; border: 1px solid #ddd; border-radius: 8px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h2>WAREHOUSE CONNECT</h2>
    <p class="sub">Multi-Device QR Chat &amp; Voice Call</p>

    <!-- SETUP SCREEN -->
    <div id="setupView">
      <input type="text" id="usernameInput" placeholder="Enter your username (e.g. Supervisor)" />
      <button class="btn-primary" id="hostBtn">START AS HOST (SHOW QR)</button>
      <div style="text-align:center; margin: 8px 0; color:#777; font-size:13px;">— OR —</div>
      <input type="text" id="roomInput" placeholder="Enter Host ID (auto-filled when scanning QR)" />
      <button class="btn-green" id="joinBtn">CONNECT TO HOST</button>
    </div>

    <!-- CONNECTED SCREEN -->
    <div id="connectedView" class="hidden">
      <div id="status">Connecting...</div>
      <div id="deviceCount" class="hidden">Connected devices: 0</div>

      <!-- INCOMING CALL BANNER -->
      <div id="incomingCallBox" class="hidden">
        <div id="incomingCallText">Incoming Call...</div>
        <div class="row" style="margin-bottom:0;">
          <button class="btn-green" id="acceptCallBtn">ACCEPT</button>
          <button class="btn-red" id="declineCallBtn">DECLINE</button>
        </div>
      </div>

      <!-- HOST TARGET SELECTOR -->
      <div id="targetBox" class="hidden">
        <label for="targetSelect">Send Message / Call Target:</label>
        <select id="targetSelect">
          <option value="ALL">All Connected Devices</option>
        </select>
      </div>

      <div class="row">
        <button class="btn-gray" id="toggleQrBtn">SHOW QR</button>
        <button class="btn-green" id="callBtn">START CALL</button>
        <button class="btn-red" id="disconnectBtn">DISCONNECT</button>
      </div>

      <div id="qrContainer">
        <div id="qrcode"></div>
        <div id="hostIdLabel" style="font-size:12px; color:#555; margin-top:6px;"></div>
      </div>

      <div id="chatBox"></div>

      <div class="row">
        <input type="text" id="msgInput" placeholder="Type a message..." style="margin:0; flex:3;" />
        <button class="btn-primary" id="sendBtn" style="flex:1;">SEND</button>
      </div>
    </div>
  </div>

  <!-- Container for multiple simultaneous voice streams -->
  <div id="audioContainer" class="hidden"></div>

  <script>
    let peer = null;
    let isHost = false;
    let username = "User";
    let hostId = "";
    let hostConn = null;
    let clientList = [];
    let localStream = null;
    let activeCalls = [];
    let pendingCall = null;
    let ringInterval = null;
    let inCall = false;
    let callIsBroadcast = false;
    let audioCtx = null;

    const setupView = document.getElementById("setupView");
    const connectedView = document.getElementById("connectedView");
    const usernameInput = document.getElementById("usernameInput");
    const roomInput = document.getElementById("roomInput");
    const statusEl = document.getElementById("status");
    const deviceCountEl = document.getElementById("deviceCount");
    const incomingCallBox = document.getElementById("incomingCallBox");
    const incomingCallText = document.getElementById("incomingCallText");
    const acceptCallBtn = document.getElementById("acceptCallBtn");
    const declineCallBtn = document.getElementById("declineCallBtn");
    const targetBox = document.getElementById("targetBox");
    const targetSelect = document.getElementById("targetSelect");
    const chatBox = document.getElementById("chatBox");
    const qrContainer = document.getElementById("qrContainer");
    const toggleQrBtn = document.getElementById("toggleQrBtn");
    const callBtn = document.getElementById("callBtn");
    const msgInput = document.getElementById("msgInput");
    const audioContainer = document.getElementById("audioContainer");

    const params = new URLSearchParams(window.location.search);
    if (params.get("host")) {
      roomInput.value = params.get("host");
      usernameInput.placeholder = "Enter your name, then tap CONNECT";
    }

    function updateDeviceListUI() {
      if (!isHost) {
        deviceCountEl.classList.add("hidden");
        targetBox.classList.add("hidden");
        return;
      }
      deviceCountEl.classList.remove("hidden");
      targetBox.classList.remove("hidden");
      deviceCountEl.textContent = "Connected devices: " + clientList.length;

      const prevSelection = targetSelect.value;
      targetSelect.innerHTML = "";

      const allOpt = document.createElement("option");
      allOpt.value = "ALL";
      allOpt.textContent = "All Connected Devices (" + clientList.length + ")";
      targetSelect.appendChild(allOpt);

      clientList.forEach(client => {
        const opt = document.createElement("option");
        opt.value = client.peerId;
        opt.textContent = client.name + " (Private)";
        targetSelect.appendChild(opt);
      });

      if (clientList.some(c => c.peerId === prevSelection)) {
        targetSelect.value = prevSelection;
      } else {
        targetSelect.value = "ALL";
      }
    }

    function initAlerts() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
      if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
      if ("Notification" in window && Notification.permission === "default") {
        Notification.requestPermission();
      }
    }

    function playAlertSound(isCall) {
      if (!audioCtx) return;
      try {
        if (audioCtx.state === "suspended") audioCtx.resume();
        const now = audioCtx.currentTime;
        const notes = isCall ? [880, 1100, 880, 1100] : [800];
        notes.forEach((freq, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, now + i * 0.18);
          gain.gain.setValueAtTime(0.4, now + i * 0.18);
          gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.18 + 0.15);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + i * 0.18);
          osc.stop(now + i * 0.18 + 0.16);
        });
      } catch (_) {}
    }

    function notifyUser(title, body, isCall) {
      playAlertSound(isCall);
      if (navigator.vibrate) {
        navigator.vibrate(isCall ? [400, 150, 400, 150, 400] : [200, 100, 200]);
      }
      if ("Notification" in window && Notification.permission === "granted") {
        try {
          new Notification(title, { body: body, requireInteraction: isCall });
        } catch (_) {}
      }
    }

    function startRinging(callerName) {
      stopRinging();
      notifyUser("Incoming Warehouse Call", callerName + " is calling...", true);
      ringInterval = setInterval(() => {
        playAlertSound(true);
        if (navigator.vibrate) navigator.vibrate([400, 150, 400]);
      }, 2000);
    }

    function stopRinging() {
      if (ringInterval) {
        clearInterval(ringInterval);
        ringInterval = null;
      }
      if (navigator.vibrate) navigator.vibrate(0);
    }

    function appendLog(text) {
      chatBox.textContent += text + "\n";
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function showConnected(statusText, showQr) {
      setupView.classList.add("hidden");
      connectedView.classList.remove("hidden");
      statusEl.textContent = statusText;
      toggleQrBtn.style.display = showQr ? "block" : "none";
      updateDeviceListUI();
    }

    // --- HOST MODE ---
    document.getElementById("hostBtn").onclick = () => {
      initAlerts();
      username = usernameInput.value.trim() || "Host";
      isHost = true;
      const shortId = "wh-" + Math.random().toString(36).substring(2, 8);
      peer = new Peer(shortId);

      peer.on("open", (id) => {
        hostId = id;
        showConnected("HOST: " + username + " (" + id + ")", true);
        appendLog("--- Hosting room: " + id + " ---");
        const joinUrl = window.location.origin + window.location.pathname + "?host=" + encodeURIComponent(id);
        document.getElementById("qrcode").innerHTML = "";
        new QRCode(document.getElementById("qrcode"), { text: joinUrl, width: 200, height: 200 });
        document.getElementById("hostIdLabel").textContent = "Scan QR with multiple devices or enter ID: " + id;
        qrContainer.style.display = "block";
      });

      peer.on("connection", (conn) => {
        const clientEntry = { peerId: conn.peer, name: "Scanner", conn: conn };
        clientList.push(clientEntry);
        updateDeviceListUI();

        if (inCall && callIsBroadcast && localStream) {
          const call = peer.call(conn.peer, localStream, { metadata: { name: username } });
          attachCallEvents(call);
        }

        conn.on("data", (data) => {
          if (data && typeof data === "object") {
            if (data.type === "join") {
              clientEntry.name = data.name || "Scanner";
              updateDeviceListUI();
              const joinMsg = "*** " + clientEntry.name + " joined ***";
              appendLog(joinMsg);
              clientList.forEach(c => { if (c.conn !== conn && c.conn.open) c.conn.send({ type: "system", text: joinMsg }); });
            } else if (data.type === "chat") {
              const formatted = data.sender + ": " + data.text;
              appendLog(formatted);
              notifyUser("Warehouse Message", formatted, false);
              clientList.forEach(c => { if (c.conn !== conn && c.conn.open) c.conn.send({ type: "chat", text: formatted }); });
            } else if (data.type === "leave") {
              const leaveMsg = "*** " + clientEntry.name + " disconnected ***";
              appendLog(leaveMsg);
              clientList.forEach(c => { if (c.conn !== conn && c.conn.open) c.conn.send({ type: "system", text: leaveMsg }); });
            }
          }
        });

        conn.on("close", () => {
          clientList = clientList.filter(c => c.peerId !== conn.peer);
          updateDeviceListUI();
        });
      });

      setupIncomingCallHandler();
      peer.on("error", (err) => alert("Connection error: " + err.message));
    };

    // --- CLIENT MODE ---
    document.getElementById("joinBtn").onclick = () => {
      initAlerts();
      username = usernameInput.value.trim() || "Associate";
      hostId = roomInput.value.trim();
      if (!hostId) { alert("Scan the Host QR code or enter the Host ID first."); return; }
      isHost = false;
      peer = new Peer();

      peer.on("open", () => {
        hostConn = peer.connect(hostId);
        hostConn.on("open", () => {
          showConnected("Connected: " + username + " -> " + hostId, false);
          appendLog("--- Connected to " + hostId + " ---");
          hostConn.send({ type: "join", name: username });
        });
        hostConn.on("data", (data) => {
          if (data && typeof data === "object" && data.text) {
            appendLog(data.text);
            if (data.type === "chat" || data.type === "private") {
              notifyUser(data.type === "private" ? "Private Message" : "Warehouse Message", data.text, false);
            }
          }
        });
        hostConn.on("close", () => {
          appendLog("--- Host disconnected ---");
          disconnectAll();
        });
      });

      setupIncomingCallHandler();
      peer.on("error", (err) => alert("Could not connect: " + err.message));
    };

    // --- CHAT (BROADCAST OR PRIVATE) ---
    function sendMessage() {
      const text = msgInput.value.trim();
      if (!text) return;
      msgInput.value = "";

      if (isHost) {
        const target = targetSelect.value;
        if (target === "ALL") {
          const formatted = username + ": " + text;
          appendLog(formatted);
          clientList.forEach(c => {
            if (c.conn.open) c.conn.send({ type: "chat", text: formatted });
          });
        } else {
          const client = clientList.find(c => c.peerId === target);
          if (client && client.conn.open) {
            appendLog("[Private to " + client.name + "] " + username + ": " + text);
            client.conn.send({ type: "private", text: "[Private] " + username + ": " + text });
          } else {
            appendLog("--- Selected device is no longer connected ---");
          }
        }
      } else if (hostConn && hostConn.open) {
        appendLog(username + ": " + text);
        hostConn.send({ type: "chat", sender: username, text: text });
      }
    }
    document.getElementById("sendBtn").onclick = sendMessage;
    msgInput.addEventListener("keypress", (e) => { if (e.key === "Enter") sendMessage(); });

    // --- QR TOGGLE ---
    toggleQrBtn.onclick = () => {
      qrContainer.style.display = qrContainer.style.display === "none" ? "block" : "none";
    };

    // --- INCOMING CALL (ACCEPT / DECLINE) ---
    function setupIncomingCallHandler() {
      peer.on("call", async (call) => {
        const callerName = (call.metadata && call.metadata.name) ? call.metadata.name : "Warehouse Device";

        // If already in a call, join automatically; otherwise show Accept/Decline banner
        if (inCall && localStream) {
          call.answer(localStream);
          attachCallEvents(call);
          return;
        }

        pendingCall = call;
        incomingCallText.textContent = "Incoming call from " + callerName;
        incomingCallBox.classList.remove("hidden");
        startRinging(callerName);

        call.on("close", () => {
          if (pendingCall === call) {
            stopRinging();
            incomingCallBox.classList.add("hidden");
            pendingCall = null;
          }
        });
      });
    }

    acceptCallBtn.onclick = async () => {
      initAlerts();
      stopRinging();
      incomingCallBox.classList.add("hidden");
      if (!pendingCall) return;

      const call = pendingCall;
      pendingCall = null;
      try {
        if (!localStream) {
          localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        }
        call.answer(localStream);
        attachCallEvents(call);
        inCall = true;
        callBtn.textContent = "END CALL";
        callBtn.className = "btn-red";
        appendLog("*** Call accepted ***");
      } catch (err) {
        alert("Microphone permission denied: " + err.message);
        call.close();
      }
    };

    declineCallBtn.onclick = () => {
      stopRinging();
      incomingCallBox.classList.add("hidden");
      if (pendingCall) {
        pendingCall.close();
        pendingCall = null;
      }
      appendLog("*** Call declined ***");
    };

    function attachCallEvents(call) {
      activeCalls.push(call);
      const audioEl = document.createElement("audio");
      audioEl.autoplay = true;
      audioEl.playsInline = true;
      audioContainer.appendChild(audioEl);

      call.on("stream", (stream) => {
        audioEl.srcObject = stream;
      });
      call.on("close", () => {
        audioEl.srcObject = null;
        audioEl.remove();
        activeCalls = activeCalls.filter(c => c !== call);
      });
    }

    // --- OUTGOING CALL ---
    callBtn.onclick = async () => {
      initAlerts();
      if (!inCall) {
        try {
          localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          inCall = true;
          callBtn.textContent = "END CALL";
          callBtn.className = "btn-red";

          if (isHost) {
            const target = targetSelect.value;
            if (target === "ALL") {
              callIsBroadcast = true;
              appendLog("*** " + username + " calling all devices... ***");
              clientList.forEach(c => {
                const call = peer.call(c.peerId, localStream, { metadata: { name: username } });
                attachCallEvents(call);
              });
            } else {
              callIsBroadcast = false;
              const client = clientList.find(c => c.peerId === target);
              if (client) {
                appendLog("*** Calling " + client.name + " (Private)... ***");
                const call = peer.call(client.peerId, localStream, { metadata: { name: username } });
                attachCallEvents(call);
              } else {
                stopCall();
                alert("Selected device is no longer connected.");
              }
            }
          } else {
            appendLog("*** Calling Host... ***");
            const call = peer.call(hostId, localStream, { metadata: { name: username } });
            attachCallEvents(call);
          }
        } catch (err) {
          alert("Microphone error: " + err.message);
        }
      } else {
        stopCall();
      }
    };

    function stopCall() {
      stopRinging();
      incomingCallBox.classList.add("hidden");
      if (pendingCall) { pendingCall.close(); pendingCall = null; }
      inCall = false;
      callIsBroadcast = false;
      activeCalls.forEach(c => c.close());
      activeCalls = [];
      audioContainer.innerHTML = "";
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
        localStream = null;
      }
      callBtn.textContent = "START CALL";
      callBtn.className = "btn-green";
      appendLog("*** Call ended ***");
    }

    // --- DISCONNECT ---
    function disconnectAll() {
      stopCall();
      if (!isHost && hostConn && hostConn.open) {
        hostConn.send({ type: "leave" });
        hostConn.close();
      }
      clientList.forEach(c => c.conn.close());
      clientList = [];
      if (peer) { peer.destroy(); peer = null; }
      chatBox.textContent = "";
      qrContainer.style.display = "none";
      deviceCountEl.classList.add("hidden");
      targetBox.classList.add("hidden");
      connectedView.classList.add("hidden");
      setupView.classList.remove("hidden");
    }

    document.getElementById("disconnectBtn").onclick = disconnectAll;
  </script>
</body>
  </html>
